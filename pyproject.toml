[project]
name = "copy-graphics"
version = "0.1.0"
description = "Copy graphics files (SVG, PNG, JPEG, BMP, ...) to the clipboard with their real MIME type."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["clipboard", "svg", "png", "inkscape", "graphics"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "pyobjc-framework-Cocoa>=9.2; sys_platform == 'darwin'",
]

[project.scripts]
copy-graphics = "copy_graphics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copy_graphics"]
